name: Windows Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  # Never cancel a run that may be publishing a release.
  cancel-in-progress: false

env:
  IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify version sources
        if: env.IS_RELEASE != 'true'
        run: python scripts/check_release.py
      - name: Verify release tag, versions and notes
        if: env.IS_RELEASE == 'true'
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Refuse to republish an existing release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -Fxq "$GITHUB_REF_NAME" <<<"$releases"; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Published releases are immutable; ship a new version."
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  installer:
    needs: [verify, ci]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-desktop.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Build installer
        shell: pwsh
        env:
          CSC_LINK: ${{ env.IS_RELEASE == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ env.IS_RELEASE == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          MLIB_GITHUB_REPOSITORY: ${{ github.repository }}
        run: .\scripts\build-windows.ps1
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mLib-windows-x64
          path: |
            dist/mLib-Setup-*-x64.exe
            dist/mLib-Setup-*-x64.exe.sha256
            dist/mLib-Setup-*-x64.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: installer
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mLib-windows-x64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          installers=(dist/mLib-Setup-*-x64.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one installer in dist, found ${#installers[@]}."
            exit 1
          fi
          installer="${installers[0]}"
          if [ "$(basename "$installer")" != "mLib-Setup-${tag#v}-x64.exe" ]; then
            echo "::error::Installer $(basename "$installer") does not match tag $tag."
            exit 1
          fi

          # Re-check right before publishing: a release must never be replaced.
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -Fxq "$tag" <<<"$releases"; then
            echo "::error::Release $tag already exists. Published releases are immutable; ship a new version."
            exit 1
          fi

          args=(
            "$tag"
            "$installer" "$installer.sha256" "$installer.blockmap" dist/latest.yml
            --repo "$GITHUB_REPOSITORY"
            --title "mLib $tag"
            --notes-file ".github/release-notes/$tag.md"
            --verify-tag
          )
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
