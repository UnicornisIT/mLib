name: Windows Desktop

# Releases are started by hand from main and never by pushing a tag: the tag v<version> only
# comes into existence when the finished draft Release is published, so a failed build leaves no
# tag behind and installed apps never see a release without update metadata.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.0.5-alpha). Empty: build only"
        required: false
        type: string
      publish:
        description: "Publish the GitHub Release (main only). Off: dry run, the installer stays an artifact"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/windows-desktop.yml
      - scripts/build-windows.ps1
      - scripts/check_release.py
      - desktop/electron-builder.config.cjs
      - desktop/package.json
      - desktop/package-lock.json

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  # Never cancel a run that may be publishing a release.
  cancel-in-progress: false

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate release request
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are published from main only, not from $GITHUB_REF."
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Set the version input to publish a release."
            exit 1
          fi
      - name: Verify version sources
        if: env.VERSION == ''
        run: python scripts/check_release.py
      - name: Verify release version, sources and notes
        if: env.VERSION != ''
        run: python scripts/check_release.py --tag "v$VERSION"
      - name: Refuse to reuse an existing release or tag
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -Fxq "$tag" <<<"$releases"; then
            echo "::error::Release $tag already exists. Published releases are immutable; ship a new version."
            exit 1
          fi
          tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')"
          if grep -Fxq "refs/tags/$tag" <<<"$tags"; then
            echo "::error::Tag $tag already exists. Published tags are immutable; ship a new version."
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  installer:
    needs: [verify, ci]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-desktop.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Build installer
        shell: pwsh
        env:
          CSC_LINK: ${{ env.PUBLISH == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ env.PUBLISH == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          MLIB_GITHUB_REPOSITORY: ${{ github.repository }}
        run: .\scripts\build-windows.ps1
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mLib-windows-x64
          path: |
            dist/mLib-Setup-*-x64.exe
            dist/mLib-Setup-*-x64.exe.sha256
            dist/mLib-Setup-*-x64.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: installer
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mLib-windows-x64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          repo="$GITHUB_REPOSITORY"
          shopt -s nullglob
          installers=(dist/mLib-Setup-*-x64.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one installer in dist, found ${#installers[@]}."
            exit 1
          fi
          installer="${installers[0]}"
          if [ "$(basename "$installer")" != "mLib-Setup-$VERSION-x64.exe" ]; then
            echo "::error::Installer $(basename "$installer") does not match version $VERSION."
            exit 1
          fi
          assets=("$installer" "$installer.sha256" "$installer.blockmap" dist/latest.yml)

          tag_exists() {
            gh api "repos/$repo/git/matching-refs/tags/$tag" --jq '.[].ref' | grep -Fxq "refs/tags/$tag"
          }

          # Re-check right before publishing, drafts included: a release must never be replaced.
          releases="$(gh release list --repo "$repo" --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -Fxq "$tag" <<<"$releases"; then
            echo "::error::Release $tag already exists (a leftover draft counts too). Published releases are immutable; ship a new version."
            exit 1
          fi
          if tag_exists; then
            echo "::error::Tag $tag already exists. Published tags are immutable; ship a new version."
            exit 1
          fi

          # 1. Draft: invisible to releases.atom and to electron-updater, and no tag yet.
          create=(
            "$tag" "${assets[@]}"
            --repo "$repo"
            --draft
            --target "$GITHUB_SHA"
            --title "mLib $tag"
            --notes-file ".github/release-notes/$tag.md"
          )
          publish=(--draft=false --repo "$repo")
          if [[ "$tag" == *-* ]]; then
            create+=(--prerelease)
          else
            publish+=(--latest)
          fi

          published=false
          # Only ever delete a release that is still a draft: it has no tag, nobody has seen it.
          discard_draft() {
            if [ "$published" = "true" ]; then
              return
            fi
            if [ "$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
              echo "::warning::Deleting the unpublished draft $tag; no tag was created."
              gh release delete "$tag" --repo "$repo" --yes || true
            fi
          }
          trap discard_draft EXIT

          gh release create "${create[@]}"
          uploaded="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets | length')"
          if [ "$uploaded" -ne "${#assets[@]}" ]; then
            echo "::error::Draft $tag has $uploaded assets, expected ${#assets[@]}."
            exit 1
          fi
          if tag_exists; then
            echo "::error::Tag $tag appeared while the draft was being prepared; refusing to attach the release to it."
            exit 1
          fi

          # 2. Publish: the tag is created on $GITHUB_SHA at this moment, with every asset in place.
          gh release edit "$tag" "${publish[@]}"
          published=true

          tagged="$(gh api "repos/$repo/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag points to '$tagged', expected $GITHUB_SHA. Do not move it; ship a new version."
            exit 1
          fi
          echo "Published $tag from $GITHUB_SHA"
