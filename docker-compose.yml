name: mlib

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: mLib
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/db/mlib.db}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:-sqlite:////data/db/core.db}
      MUSIC_DATABASE_URL: ${MUSIC_DATABASE_URL:-sqlite:////data/db/music.db}
      MOVIE_DATABASE_URL: ${MOVIE_DATABASE_URL:-sqlite:////data/db/movie.db}
      BOOKS_DATABASE_URL: ${BOOKS_DATABASE_URL:-sqlite:////data/db/books.db}
      COLLECTIONS_DATABASE_URL: ${COLLECTIONS_DATABASE_URL:-sqlite:////data/db/collections.db}
      GAMES_DATABASE_URL: ${GAMES_DATABASE_URL:-sqlite:////data/db/games.db}
      WISHES_DATABASE_URL: ${WISHES_DATABASE_URL:-sqlite:////data/db/wishes.db}
      MEDIA_ROOT: /data/media
      IMPORT_ROOT: /imports
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      MOVIE_METADATA_REFRESH_HOURS: ${MOVIE_METADATA_REFRESH_HOURS:-24}
    volumes:
      - mlib_data:/data
      - ${MUSIC_IMPORT_PATH:-./import}:/imports:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"

  nginx:
    image: nginx:1.29-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mlib_data:
