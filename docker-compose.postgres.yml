services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlib_core
      POSTGRES_USER: ${POSTGRES_USER:-mlib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-databases.sql:/docker-entrypoint-initdb.d/10-mlib-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    environment:
      CORE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlib}:${POSTGRES_PASSWORD}@postgres:5432/mlib_core
      MUSIC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlib}:${POSTGRES_PASSWORD}@postgres:5432/mlib_music
      MOVIE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlib}:${POSTGRES_PASSWORD}@postgres:5432/mlib_movie
      BOOKS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlib}:${POSTGRES_PASSWORD}@postgres:5432/mlib_books
      COLLECTIONS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlib}:${POSTGRES_PASSWORD}@postgres:5432/mlib_collections
      GAMES_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlib}:${POSTGRES_PASSWORD}@postgres:5432/mlib_games
      WISHES_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlib}:${POSTGRES_PASSWORD}@postgres:5432/mlib_wishes
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
